<nz-layout class="admin-layout">
    @if(!isCollapsed) {
        <nz-sider [nzWidth]="260"
        nzBreakpoint="md"
        (nzCollapsedChange)="onChange($event)"
        [nzCollapsible]="true"
        [nzTrigger]="null"
        class="admin-sider">
        <div class="sider-inner">
            <div class="sider-brand">
                <app-anixi-logo variant="sidebar" tagline="Admin Portal"></app-anixi-logo>
            </div>
            <div class="sider-divider"></div>
            <nav class="sider-nav">
                <p class="nav-section-label">Operations</p>
                <ul class="nav-list">
                    @for(menu of menuIcons; track menu.name) {
                        <li
                            class="nav-item"
                            [routerLink]="menu.path"
                            routerLinkActive="nav-item--active"
                            [routerLinkActiveOptions]="{exact: true}"
                        >
                            <lucide-icon [name]="menu.icon" class="nav-icon"></lucide-icon>
                            <span class="nav-label">{{ menu.name }}</span>
                        </li>
                    }
                </ul>
            </nav>
        </div>
        </nz-sider>
    }
    @else {
         <nz-sider [nzWidth]="260"
        nzBreakpoint="md"
        (nzCollapsedChange)="onChange($event)"
        [nzCollapsible]="true"
        [nzTrigger]="null"
        class="admin-sider">
        <div class="sider-inner sider-inner--collapsed">
            <div class="sider-brand sider-brand--collapsed">
                <img src="/anixi.png" alt="Anixi Health" class="sider-logo-icon" />
            </div>
            <ul class="nav-list nav-list--collapsed">
                @for(menu of menuIcons; track menu.name) {
                    <li
                        class="nav-item nav-item--icon-only"
                        [routerLink]="menu.path"
                        routerLinkActive="nav-item--active"
                        [routerLinkActiveOptions]="{exact: true}"
                    >
                        <lucide-icon [name]="menu.icon" class="nav-icon"></lucide-icon>
                    </li>
                }
            </ul>
        </div>
        </nz-sider>
    }
    <nz-layout class="admin-main">
        <header class="admin-header">
            <div class="admin-header-greeting">
                <p class="greeting-label">Welcome back</p>
                <p class="greeting-name">{{ adminUser?.displayName || 'Admin' }}</p>
            </div>
            <div class="admin-header-actions">
                <app-admin-profile-menu [adminUser]="adminUser"></app-admin-profile-menu>
            </div>
        </header>
        <nz-content class="admin-content">
            <router-outlet></router-outlet>
        </nz-content>
    </nz-layout>
</nz-layout>
