<div class="p-4 mt-4">
    <div class="flex flex-col">
        <p class="text-2xl font-semibold h-[10px]">Doctor Verification</p>
        <p class="text-gray-500">Review, verify, and manage doctors applications.</p>
    </div>
    <div class="grid md:grid-cols-4 grid-cols-2 gap-4">
        <!-- card -->
         @for(card of statCards; track card.label) {
             <div class="max-w-sm h-[90px] p-4 bg-white
              border-transparent shadow-lg rounded-lg transition-all duration-300
               ease-in-out hover:scale-105 hover:border-1 hover:border-green-200">
                 <p class="text-xs font-medium uppercase tracking-wider text-gray-400">{{card.label}}</p>
                 <p class="font-bold text-2xl" [ngStyle]="{'color': card.color}">{{card.value}}</p>
             </div>
         }
    </div>
    <form>
        <div class="flex md:flex-row flex-col mt-6 gap-2">
            <div class="bg-white border-transparent shadow-lg rounded-lg p-6 w-full">
                <div class="flex flex-row justify-between">
                    <h1 class="text-base" >Doctor Applications</h1>
                    <span class="search">
                        <nz-icon class="relative left-6 text-lg" nzType="search" nzTheme="outline"></nz-icon>
                        <input class="border-1 border-gray-200 rounded-lg p-1 sm:w-[220px] w-[140px]" type="search" placeholder="Search doctors...">
                    </span>
                </div>
                <div class="flex flex-row wrapper mt-4">
                    @for(input of customInput; track input.label) {
                        <div class="custom-input">
                            <input type="radio" [id]="input.value" [value]="input.value"  [formControl]="verificationStatus" checked>
                            <label [for]="input.value">{{input.label}}</label>
                        </div>
                    }
                    <!-- <div class="custom-input">
                        <input type="radio" id="pending" value="pending" [formControl]="verificationStatus">
                        <label for="pending">Pending (4)</label>
                    </div>
                    <div class="custom-input">
                        <input type="radio" id="approved" value="approved" [formControl]="verificationStatus">
                        <label for="approved">Approved (6)</label>
                    </div>
                    <div class="custom-input">
                        <input type="radio" id="rejected" value="rejected" [formControl]="verificationStatus">
                        <label for="rejected">Rejected (1)</label>
                    </div>
                    <div class="custom-input">
                        <input type="radio" id="suspended" value="suspended" [formControl]="verificationStatus">
                        <label for="suspended">Suspended (3)</label>
                    </div> -->
                </div>
            </div>
            <div class="md:w-[500px] w-full bg-white border-transparent shadow-lg rounded-lg p-4">
                
            </div>
        </div>
    </form>
</div>
