<div class="ops-page analytics-page">
  <header class="ops-page-header">
    <div class="ops-page-header__copy">
      <p class="ops-page-header__eyebrow">Platform</p>
      <h1 class="ops-page-header__title">Analytics</h1>
      <p class="ops-page-header__subtitle">
        Platform snapshot from Django-backed admin data — users, doctor verification, and community content.
      </p>
    </div>
  </header>

  @if (isLoading) {
    <div class="ops-chart-grid">
      @for (i of [1, 2, 3]; track i) {
        <section class="ops-panel ops-chart-card">
          <div class="ops-panel__body">
            <nz-skeleton [nzActive]="true" [nzParagraph]="{ rows: 8 }"></nz-skeleton>
          </div>
        </section>
      }
    </div>
  } @else {
    <div class="ops-chart-grid">
      <section class="ops-panel ops-chart-card" aria-label="Users by role">
        <div echarts [options]="userRoleChart" class="analytics-chart"></div>
      </section>
      <section class="ops-panel ops-chart-card" aria-label="Doctors by verification status">
        <div echarts [options]="doctorStatusChart" class="analytics-chart"></div>
      </section>
      <section class="ops-panel ops-chart-card" aria-label="Community posts by status">
        <div echarts [options]="postStatusChart" class="analytics-chart"></div>
      </section>
    </div>
  }
</div>
